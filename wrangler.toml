name = "ddlab-data"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# SPA estática servida pelo Worker
[assets]
directory = "dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ETL diário — 06:00 America/Sao_Paulo = 09:00 UTC
[triggers]
crons = ["0 9 * * *"]

# Banco pré-agregado. Rode:  wrangler d1 create ddlab-data
# e cole o database_id retornado aqui.
[[d1_databases]]
binding = "DB"
database_name = "ddlab-data"
database_id = "a6131f1a-55c4-452a-83df-f84721b73869"
migrations_dir = "migrations"

# Vars não-secretas (secrets vão por `wrangler secret put`)
[vars]
# Sinaliza produção: com isso setado, o Worker RECUSA servir /api/* (500) se
# CF_ACCESS_TEAM_DOMAIN/CF_ACCESS_AUD estiverem vazios, em vez de liberar acesso
# sem login (fail-closed). Em dev local (.dev.vars), deixe ausente.
ENVIRONMENT = "production"
GCP_PROJECT_ID = "studio-7861914720-de430"
BQ_DATASET = "mcc_ddlab_google_ads"
BQ_MCC_SUFFIX = "9123420378"
# CF_ACCESS_TEAM_DOMAIN e CF_ACCESS_AUD NÃO ficam aqui — são secrets (wrangler
# secret put / dashboard → Runtime → Variables and Secrets). Isso já causou
# bugs sérios: `wrangler deploy` reaplica todo o conteúdo de [vars] a cada
# deploy, então tê-las aqui (mesmo vazias) sobrescrevia o secret configurado
# manualmente TODA VEZ que o Workers Builds rodava — e ainda colidia com
# scripts/deploy.sh tentando recriá-las como secret ("Binding name ... already
# in use", erro 10053), derrubando o próprio deploy. Nunca redeclare essas
# duas aqui.
# Modelos usados na Análise IA / Diagnóstico IA / Classificação de termos.
# Provedor padrão é o Gemini (mais barato); Claude fica disponível por conta
# em Configurações (campo ai_provider). Chaves via `wrangler secret put
# GEMINI_API_KEY` / `ANTHROPIC_API_KEY`.
GEMINI_MODEL = "gemini-3.7-flash"
ANTHROPIC_MODEL = "claude-sonnet-5"

[observability]
enabled = true
